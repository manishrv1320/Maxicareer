<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" fill="none">
  <defs>
    <linearGradient id="heroGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="heroGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" />
      <stop offset="100%" stop-color="#DBEAFE" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="softElevation" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2563EB" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Decorative Circles & Constellations -->
  <circle cx="350" cy="280" r="230" stroke="#EFF6FF" stroke-width="2" stroke-dasharray="6 6" opacity="0.8" />
  <circle cx="350" cy="280" r="170" stroke="#DBEAFE" stroke-width="1.5" opacity="0.6" />
  
  <!-- Subtle ambient glow background shapes -->
  <circle cx="210" cy="160" r="90" fill="#38BDF8" opacity="0.12" filter="blur(40px)" />
  <circle cx="500" cy="380" r="110" fill="#2563EB" opacity="0.1" filter="blur(50px)" />

  <!-- Central Career Roadmap Isometric/Orthographic Board -->
  <g filter="url(#softElevation)">
    <!-- Main Window / Dashboard Board -->
    <rect x="110" y="80" width="480" height="340" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Window Bar -->
    <rect x="110" y="80" width="480" height="42" rx="20" fill="#F1F5F9" />
    <path d="M110 122H590" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="138" cy="101" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="154" cy="101" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="170" cy="101" r="5" fill="#10B981" opacity="0.8" />
    <rect x="230" y="93" width="240" height="16" rx="8" fill="#E2E8F0" opacity="0.7" />

    <!-- Interactive Career Roadmap Grid -->
    <!-- Stepper Pathway -->
    <path d="M160 290 C 220 290, 240 200, 310 200 C 380 200, 410 270, 480 230 C 510 210, 525 180, 535 160" 
          stroke="url(#heroGrad1)" stroke-width="5" stroke-linecap="round" fill="none" />
    
    <!-- Roadmap Milestone Nodes -->
    <!-- Node 1: Skill Discovery -->
    <g transform="translate(160, 290)">
      <circle r="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" filter="url(#softElevation)" />
      <circle r="8" fill="#2563EB" />
      <text x="-4" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Discovery</text>
    </g>

    <!-- Node 2: Mentorship -->
    <g transform="translate(310, 200)">
      <circle r="20" fill="#FFFFFF" stroke="#38BDF8" stroke-width="4" filter="url(#softElevation)" />
      <circle r="9" fill="#38BDF8" />
      <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Mentorship</text>
    </g>

    <!-- Node 3: Skill Mastery -->
    <g transform="translate(480, 230)">
      <circle r="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="4" filter="url(#softElevation)" />
      <circle r="8" fill="#2563EB" />
      <text x="0" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0F172A" text-anchor="middle">Skill Project</text>
    </g>

    <!-- Node 4: Career Launch -->
    <g transform="translate(535, 160)">
      <circle r="22" fill="url(#heroGrad1)" filter="url(#glowBlue)" />
      <!-- Star icon inside -->
      <path d="M0 -8L2.5 -2.5L8.5 -1.5L4 2.5L5.5 8.5L0 5.5L-5.5 8.5L-4 2.5L-8.5 -1.5L-2.5 -2.5Z" fill="#FFFFFF" />
    </g>

    <!-- Mini Analytics / Skill Growth Bars -->
    <g transform="translate(145, 140)">
      <rect width="120" height="50" rx="10" fill="#EFF6FF" />
      <text x="12" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1E293B">Career Readiness</text>
      <rect x="12" y="30" width="96" height="6" rx="3" fill="#DBEAFE" />
      <rect x="12" y="30" width="82" height="6" rx="3" fill="#2563EB" />
    </g>
  </g>

  <!-- Floating Feature Card 1: 1-on-1 Mentorship (Left Bottom) -->
  <g transform="translate(60, 340)" filter="url(#softElevation)">
    <rect width="210" height="88" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <circle cx="36" cy="44" r="22" fill="#EFF6FF" />
    <circle cx="36" cy="38" r="8" fill="#2563EB" />
    <path d="M24 53C24 47 29 45 36 45C43 45 48 47 48 53" fill="#2563EB" />
    <text x="70" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0F172A">Active Mentor</text>
    <text x="70" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#64748B">Live 1-on-1 Guidance</text>
    <circle cx="185" cy="44" r="5" fill="#10B981" />
  </g>

  <!-- Floating Feature Card 2: Skill Growth Score (Right Top) -->
  <g transform="translate(470, 70)" filter="url(#softElevation)">
    <rect width="190" height="92" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <rect x="18" y="18" width="38" height="38" rx="10" fill="url(#heroGrad1)" />
    <!-- Upward arrow -->
    <path d="M37 42V30M37 30L32 35M37 30L42 35" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="68" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" fill="#0F172A">96.4%</text>
    <text x="68" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="600" fill="#64748B">Confidence Index</text>
    <rect x="18" y="66" width="154" height="6" rx="3" fill="#F1F5F9" />
    <rect x="18" y="66" width="138" height="6" rx="3" fill="#38BDF8" />
  </g>

  <!-- Floating Tag: Structured Roadmap (Center Bottom) -->
  <g transform="translate(260, 440)" filter="url(#softElevation)">
    <rect width="230" height="54" rx="27" fill="#0F172A" />
    <circle cx="30" cy="27" r="14" fill="#2563EB" />
    <path d="M26 27L29 30L35 24" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="54" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Clear Milestones Ahead</text>
  </g>
</svg>
